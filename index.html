<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZZZFES2026organization</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ffe600'/%3E%3Ctext x='32' y='44' font-size='36' font-weight='900' text-anchor='middle' fill='%231c1c1a' font-family='sans-serif'%3E%E9%9B%B6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* ==================== 设计变量 ==================== */
:root{
  --yellow:#ffe600;
  --yellow-deep:#f0c400;
  --ink:#161615;
  --ink-soft:#42423e;
  --coal:#262624;
  --coal-deep:#1b1b19;
  --steel:#7e8fa8;
  --metal-l:#ecece8;
  --metal-m:#b6b6b1;
  --metal-d:#8a8a85;
  --paper:#ecece7;
  --paper-deep:#d8d8d2;
  --card:#f4f4f0;
  --card-deep:#e6e6e0;
  --light:#ffffff;
  --line:#171715;
  --radius:12px;
  --shadow:5px 5px 0 rgba(0,0,0,.35);
  --shadow-y:5px 5px 0 var(--yellow-deep);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--paper);
  line-height:1.55;
  background-color:var(--coal);
  background-image:radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.3px);
  background-size:18px 18px;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px 70px}

/* 黄黑警示斜纹条 */
.hazard{height:12px;background:repeating-linear-gradient(45deg,var(--ink) 0 13px,var(--yellow) 13px 26px);border-bottom:2px solid var(--ink)}

/* ==================== 顶部标题（深色情报头） ==================== */
.topbar{
  background-color:var(--coal-deep);
  background-image:
    radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.3px),
    linear-gradient(180deg,rgba(255,230,0,.1),transparent 65%);
  background-size:18px 18px,100% 100%;
  border-bottom:5px solid var(--yellow);
  position:relative;overflow:hidden;
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:28px 22px 26px;position:relative}
.topbar-side{position:absolute;right:22px;top:26px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fes-tag{
  border:2px solid var(--yellow);border-radius:6px;padding:4px 13px;
  font-weight:900;font-size:13px;letter-spacing:1px;background:var(--yellow);color:var(--ink);
}
.maker{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.maker-label{font-size:10px;font-weight:900;letter-spacing:1px;color:var(--metal-m)}
.maker-id{font-size:14px;font-weight:900;line-height:1.2;color:var(--paper)}
.maker-link{
  background:var(--yellow);color:var(--ink);border:2px solid var(--yellow);
  border-radius:7px;font-size:12px;font-weight:900;padding:6px 14px;transition:transform .12s;
}
.maker-link:hover{transform:translateY(-2px)}
.topbar h1{font-size:clamp(24px,4vw,40px);font-weight:900;letter-spacing:.5px;line-height:1.2;color:#fff}
.topbar p{margin-top:10px;font-weight:500;font-size:14px;color:var(--metal-m);max-width:780px}
.topbar h1 .blk{background:var(--yellow);color:var(--ink);padding:0 11px;border-radius:5px;display:inline-block;transform:rotate(-1.5deg)}

/* ==================== 统计与控制条 ==================== */
.controls{
  display:flex;flex-wrap:wrap;gap:13px;align-items:center;
  margin:26px 0 8px;
}
.stat-pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{
  background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:4px;
  padding:8px 17px;font-weight:700;font-size:13px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}
.pill b{font-size:16px}
.pill.solid{background:var(--yellow);color:var(--ink);border-color:var(--line)}
.zone-filters{display:flex;gap:8px;flex-wrap:wrap}
.zf{
  border:2px solid var(--line);border-radius:6px;padding:9px 18px;font-weight:900;font-size:14px;
  background:var(--card);color:var(--ink);transition:transform .12s,background .12s;
}
.zf:hover{transform:translateY(-2px)}
.zf.active{background:var(--yellow)}
.zf .n{font-size:11px;font-weight:500;opacity:.65;margin-left:3px}

/* ==================== 角色筛选器 ==================== */
.role-picker{position:relative;min-width:210px}
.role-trigger{
  display:flex;align-items:center;gap:9px;width:100%;
  border:2px solid var(--line);border-radius:6px;padding:9px 15px;
  background:var(--card);color:var(--ink);font-weight:900;font-size:14px;transition:transform .12s,background .12s;
}
.role-trigger:hover{transform:translateY(-2px)}
.role-picker.open .role-trigger{background:var(--yellow)}
.rt-label{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-caret{
  width:9px;height:9px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);
  transform:rotate(45deg);transition:transform .15s;flex:none;margin-top:-3px;
}
.role-picker.open .rt-caret{transform:rotate(-135deg);margin-top:3px}
.role-panel{
  position:absolute;top:calc(100% + 8px);left:0;width:100%;min-width:260px;
  background:var(--light);border:2px solid var(--line);border-radius:8px;
  box-shadow:7px 7px 0 rgba(0,0,0,.4);z-index:60;
  display:none;flex-direction:column;overflow:hidden;
}
.role-picker.open .role-panel{display:flex}
.role-search-wrap{padding:11px 11px 9px;border-bottom:2px solid var(--line)}
.role-search{
  width:100%;border:2px solid var(--line);border-radius:6px;padding:8px 11px;
  font-family:inherit;font-size:13px;font-weight:500;background:#fff;color:var(--ink);outline:none;
}
.role-search:focus{box-shadow:0 0 0 2px var(--yellow)}
.role-options{max-height:282px;overflow-y:auto;padding:7px}
.role-opt{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;border-radius:6px;padding:8px 11px;
  font-weight:700;font-size:13px;color:var(--ink);background:var(--light);transition:background .1s;
}
.role-opt:hover,.role-opt.kbd-focus{background:var(--yellow);color:var(--ink)}
.role-opt.selected{background:var(--yellow);color:var(--ink)}
.role-opt .ro-n{font-size:11px;font-weight:700;color:var(--ink);flex:none}
.role-opt.selected .ro-n,.role-opt:hover .ro-n{color:var(--ink)}
.role-empty{padding:16px 12px;text-align:center;font-size:12px;color:var(--ink-soft);font-weight:500}

/* ==================== 主页摊位区 ==================== */
.zone-block{margin-top:34px}
.zone-head{
  display:flex;align-items:center;gap:14px;margin-bottom:16px;
  background:linear-gradient(180deg,var(--metal-l) 0%,var(--metal-m) 48%,var(--metal-d) 100%);
  border:2px solid var(--line);border-radius:6px;padding:8px 16px;
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);
}
.zone-badge{
  width:44px;height:44px;border-radius:5px;background:var(--ink);
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:23px;color:var(--yellow);flex:none;
}
.zone-head h2{font-weight:900;font-size:20px;color:var(--ink);letter-spacing:1px}
.zone-head .zc{
  margin-left:auto;font-size:12px;font-weight:900;color:var(--yellow);
  background:var(--ink);border:2px solid var(--line);padding:4px 12px;border-radius:5px;
}
.stall-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:11px}
.stall-card{
  display:flex;flex-direction:column;gap:8px;min-width:0;
  background:var(--card);border:2px solid var(--line);border-radius:7px;padding:10px 8px 12px;
  position:relative;transition:transform .13s,box-shadow .13s;
}
.stall-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-y)}
.stall-card:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.stall-no{
  align-self:flex-start;background:var(--yellow);color:var(--ink);font-weight:900;
  font-size:13px;padding:2px 10px;border-radius:5px;border:1.5px solid var(--line);
}
.stall-name{font-weight:700;font-size:13px;line-height:1.35;color:var(--ink);word-break:break-word}
.stall-status{margin-top:auto;font-size:11px;font-weight:900;padding:3px 9px;border-radius:5px;align-self:flex-start}
.ss-done{background:var(--ink);color:var(--yellow)}
.ss-demo{background:var(--yellow);color:var(--ink);border:1.5px solid var(--line)}
.ss-todo{background:transparent;color:var(--ink-soft);border:1.5px solid var(--metal-d)}

/* ==================== 详情页 ==================== */
#view-detail{display:none}
body.detail-on #view-home{display:none}
body.detail-on #view-detail{display:block}
.crumb{display:flex;align-items:center;gap:10px;margin:24px 0 18px;flex-wrap:wrap}
.back-btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--yellow);
  font-weight:900;font-size:13px;padding:9px 16px;border-radius:6px;border:2px solid var(--line);transition:transform .12s;
}
.back-btn:hover{transform:translateX(-3px)}
.crumb .sep{opacity:.5}
.crumb .cur{font-weight:700;font-size:13px;color:var(--paper)}

.detail-hero{
  background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:8px;
  padding:26px 28px;position:relative;overflow:hidden;
}
.detail-hero::before{
  content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  background:repeating-linear-gradient(45deg,var(--yellow) 0 12px,var(--ink) 12px 24px);
  opacity:.18;transform:rotate(8deg);
}
.dh-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.dh-no{
  background:var(--ink);color:var(--yellow);border:2px solid var(--line);border-radius:6px;font-weight:900;
  font-size:30px;padding:6px 20px;transform:rotate(-2deg);
}
.dh-name{font-size:clamp(22px,3.4vw,32px);font-weight:900;color:var(--ink)}
.dh-zone{font-weight:900;font-size:13px;background:var(--paper-deep);color:var(--ink);border:1.5px solid var(--metal-d);padding:4px 13px;border-radius:5px}
.demo-flag{background:var(--yellow);color:var(--ink);border:2px solid var(--line);font-weight:900;font-size:12px;padding:4px 11px;border-radius:5px}

.owner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;position:relative}
.owner-cell{background:var(--paper);border:2px solid var(--metal-d);border-radius:7px;padding:14px 16px;min-width:0}
.owner-cell .k{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--ink);margin-bottom:7px}
.owner-cell .v{font-size:14px;font-weight:500;color:var(--ink);word-break:break-word}
.xhs-link{display:inline-flex;align-items:center;gap:7px;background:var(--yellow);color:var(--ink);border:2px solid var(--line);border-radius:6px;font-weight:900;font-size:13px;padding:7px 14px;transition:transform .12s}
.xhs-link:hover{transform:translateY(-2px)}
.search-link{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--yellow);border:2px solid var(--line);border-radius:6px;font-weight:900;font-size:13px;padding:8px 15px;margin-top:8px}

/* 空状态 */
.empty-box{
  margin-top:22px;background:var(--card);color:var(--ink);border:2px dashed var(--metal-d);border-radius:8px;
  padding:34px 26px;text-align:center;
}
.empty-box h3{font-size:18px;font-weight:900;margin-bottom:8px;color:var(--ink)}
.empty-box p{font-size:13px;color:var(--ink-soft);max-width:520px;margin:0 auto 16px}

/* 制品区 */
.product-section{margin-top:32px}
.section-title{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
  background:var(--ink);border:2px solid var(--line);border-radius:6px;padding:10px 16px;
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);
}
.section-title .bar{width:8px;height:26px;background:var(--yellow);border-radius:2px;flex:none}
.section-title h2{font-size:21px;font-weight:900;color:var(--yellow);letter-spacing:1px}
.section-title .cnt{margin-left:auto;font-size:12px;font-weight:900;color:var(--paper)}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.gallery-card{margin:0;background:var(--card);border:2px solid var(--line);border-radius:7px;overflow:hidden;min-width:0;transition:transform .13s,box-shadow .13s}
.gallery-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-y)}
.gallery-card img{width:100%;height:auto;display:block;cursor:zoom-in;background:var(--paper-deep)}
/* ===== 图片放大 Lightbox ===== */
.lightbox{position:fixed;inset:0;background:rgba(12,12,11,.93);display:flex;align-items:center;justify-content:center;padding:18px;z-index:999;opacity:0;visibility:hidden;transition:opacity .2s;cursor:zoom-out}
.lightbox.open{opacity:1;visibility:visible}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 12px 44px rgba(0,0,0,.6)}
.lb-close{position:absolute;top:16px;right:20px;width:46px;height:46px;border-radius:6px;background:var(--yellow);color:var(--ink);font-size:26px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.lb-close:active{transform:scale(.92)}

/* 上一个/下一个 */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.pager a{flex:1;border:2px solid var(--line);border-radius:7px;padding:13px 16px;background:var(--card);color:var(--ink);font-weight:700;font-size:13px;transition:background .12s,transform .12s;min-width:0}
.pager a:hover{background:var(--yellow);transform:translateY(-2px)}
.pager .next{text-align:right}
.pager .dir{display:block;font-size:10px;font-weight:900;opacity:.6;letter-spacing:1px}
.pager .disabled{opacity:.4;pointer-events:none}

/* 视图进入动画 */
.view-enter{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==================== 响应式 ==================== */
@media (max-width:1100px){
  .stall-grid{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:760px){
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .owner-grid{grid-template-columns:1fr}
  .topbar-side{position:static;align-items:flex-start;margin-top:14px}
  .maker{align-items:flex-start}
  .role-picker{flex:1 1 100%;min-width:0}
  .role-panel{min-width:0}
}
@media (max-width:720px){.stall-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:460px){
  .stall-grid{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:0 14px 50px}
  .detail-hero{padding:20px 18px}
}

/* ==================== 收藏功能 ==================== */
.fav-toggle{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.fav-toggle .ico{transition:fill .12s}
/* 主页卡片右上角星星角标 */
.card-star{
  position:absolute;top:7px;right:7px;width:28px;height:28px;
  background:var(--light);border:1.6px solid var(--line);border-radius:7px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
}
.card-star .ico{width:20px;height:20px;fill:#fff;stroke:var(--ink);stroke-width:1.4}
.card-star.on .ico{fill:var(--yellow)}
/* 详情页摊位收藏星星按钮 */
.stall-fav-btn{
  width:48px;height:48px;border-radius:9px;border:2px solid var(--metal-d);
  background:var(--paper);transition:transform .12s,background .12s,border-color .12s;
}
.stall-fav-btn:hover{transform:translateY(-2px);border-color:var(--line)}
.stall-fav-btn .ico{width:29px;height:29px;fill:#fff;stroke:var(--ink);stroke-width:1.5}
.stall-fav-btn.on{background:var(--yellow);border-color:var(--line)}
.stall-fav-btn.on .ico{fill:var(--yellow)}
/* 图片右下角爱心 */
.gallery-card{position:relative}
.img-heart{
  position:absolute;right:9px;bottom:9px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.93);border:2px solid var(--line);
  box-shadow:0 2px 5px rgba(0,0,0,.28);transition:transform .12s;
}
.img-heart:hover{transform:scale(1.08)}
.img-heart .ico{width:22px;height:22px;fill:#fff;stroke:var(--ink);stroke-width:1.7}
.img-heart.on .ico{fill:#e63946;stroke:var(--ink)}
/* 只看已收藏切换按钮（复用 .zf） */
.fav-only-btn.active{background:var(--yellow)}
</style>
</head>
<body>

<div class="hazard" aria-hidden="true"></div>

<!-- ==================== 顶部（两个视图共用） ==================== -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-side">
      <span class="fes-tag">FES 2026</span>
      <div class="maker">
        <span class="maker-label">制作 / 联系</span>
        <span class="maker-id">三天不打鱼</span>
        <a class="maker-link" target="_blank" rel="noopener" href="https://www.xiaohongshu.com/user/profile/6523f1ad000000002a0296fd">小红书主页</a>
      </div>
    </div>
    <h1>绝区零 FES 2026 <span class="blk">4号馆同人区</span> 摊位信息汇总</h1>
    <p>官方名单仅有摊位位置与名称，本页汇总各摊主在小红书发布的制品信息。摊主有任何需要修改可点击旁边的小红书主页进行联系。点击任意摊位即可查看摊主与在售制品，点击图片可查看高清大图（加载较慢），角色筛选器已加入</p>
  </div>
</header>

<div class="wrap">

<!-- ==================== 视图：主页 ==================== -->
<main id="view-home">
  <div class="controls">
    <div class="stat-pills">
      <span class="pill solid">总摊位 <b id="stat-total">0</b></span>
      <span class="pill">已收录 <b id="stat-done">0</b></span>
      <span class="pill">未收录 <b id="stat-todo">0</b></span>
    </div>
    <div class="zone-filters" id="zone-filters"></div>
    <button class="zf fav-only-btn" id="fav-only-btn" type="button">只看已收藏</button>
    <div class="role-picker" id="role-picker">
      <button class="role-trigger" id="role-trigger" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="rt-label" id="rt-label">按角色筛选摊位</span>
        <span class="rt-caret" aria-hidden="true"></span>
      </button>
      <div class="role-panel" id="role-panel">
        <div class="role-search-wrap">
          <input type="text" class="role-search" id="role-search" placeholder="输入角色名搜索" autocomplete="off">
        </div>
        <div class="role-options" id="role-options"></div>
      </div>
    </div>
  </div>
  <div id="zone-container"></div>
</main>

<!-- ==================== 视图：摊位详情（由 JS 填充） ==================== -->
<main id="view-detail"></main>

</div>

<div class="hazard" aria-hidden="true" style="margin-top:20px"></div>

<!-- ==================== 图片放大层 ==================== -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lb-close" type="button" aria-label="关闭">&times;</button>
  <img class="lb-img" id="lb-img" src="" alt="">
</div>

<script>
/* ================================================================
   数据区
   ① STALLS：官方摊位名单（编号 + 名称），已全部录入，一般无需改动。
   ② STALL_DETAILS：摊主与制品详情。只需为“已收集到信息”的摊位添加条目，
      没有条目的摊位会自动显示“待补充”。
   - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
   【填写模板】复制下面整段，把键名（如 'A02'）换成对应摊位编号：
   'A02': {
     owner: '摊主昵称或社团名（多个摊主可写数组，如 ['摊主一','摊主二']）',
     xhs:   '摊主主页或帖子链接（可留空，多个链接写数组）',
     note: '已收录部分或全部制品',

function isImgFav(u){return favImages.has(u);}
function toggleStallFav(id){
  if(favStalls.has(id))favStalls.delete(id);else favStalls.add(id);
  saveSet(FAV_STALL_KEY,favStalls);
}
function toggleImgFav(u){
  if(favImages.has(u))favImages.delete(u);else favImages.add(u);
  saveSet(FAV_IMG_KEY,favImages);
}
/* 内联 SVG 图标 */
const STAR_ICO='<svg class="ico" viewBox="0 0 24 24"><path d="M12 2.6l2.86 5.79 6.39.93-4.62 4.5 1.09 6.37L12 17.27l-5.72 3.01 1.09-6.37-4.62-4.5 6.39-.93z"/></svg>';
const HEART_ICO='<svg class="ico" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

/* ==================== 主页渲染 ==================== */
function renderStats(){
  const done=STALLS.filter(s=>hasImages(s.id)).length;
  document.getElementById('stat-total').textContent=STALLS.length;
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-todo').textContent=STALLS.length-done;
}
function renderZoneFilters(){
  const el=document.getElementById('zone-filters');
  let html='<button class="zf'+(activeZone==='ALL'?' active':'')+'" data-zone="ALL">全部</button>';
  ZONES.forEach(z=>{
    const n=STALLS.filter(s=>s.id[0]===z&&hasImages(s.id)).length;
    const t=STALLS.filter(s=>s.id[0]===z).length;
    html+='<button class="zf'+(activeZone===z?' active':'')+'" data-zone="'+z+'">'+ZONE_NAME[z]+'<span class="n">'+n+'/'+t+'</span></button>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.zf').forEach(b=>b.addEventListener('click',()=>{activeZone=b.dataset.zone;renderHome();}));
}
function statusBadge(s){
  if(hasImages(s.id))return '<span class="stall-status ss-done">已收录</span>';
  return '<span class="stall-status ss-todo">未收录</span>';
}
function renderHome(){
  renderZoneFilters();
  const roleList=activeRole?ROLE_MAP[activeRole]:null;
  const box=document.getElementById('zone-container');
  let html='';
  let shown=0;
  ZONES.forEach(z=>{
    if(activeZone!=='ALL'&&activeZone!==z)return;
    let list=STALLS.filter(s=>s.id[0]===z);
    if(roleList)list=list.filter(s=>roleList.indexOf(s.id)!==-1);
    if(favOnly)list=list.filter(s=>isStallFav(s.id));
    if(!list.length)return;
    shown+=list.length;
    const done=list.filter(s=>hasImages(s.id)).length;
    const zcText=activeRole?('本页显示 '+list.length+' 摊'):('已收录 '+done+' / 9');
    html+='<section class="zone-block view-enter"><div class="zone-head">'+
      '<span class="zone-badge">'+z+'</span><h2>'+ZONE_NAME[z]+'</h2>'+
      '<span class="zc">'+zcText+'</span></div><div class="stall-grid">';
    list.forEach(s=>{
      html+='<a class="stall-card" href="#/stall/'+s.id+'">'+
        '<span class="fav-toggle card-star'+(isStallFav(s.id)?' on':'')+'" data-fav-stall="'+s.id+'" aria-label="收藏摊位">'+STAR_ICO+'</span>'+
        '<span class="stall-no">'+s.id+'</span>'+
        '<span class="stall-name">'+esc(s.name)+'</span>'+statusBadge(s)+'</a>';
    });
    html+='</div></section>';
  });
  if(shown===0){
    if(favOnly){
      html='<div class="empty-box"><h3>还没有收藏任何摊位</h3><p>进入摊位详情页，点击星星即可收藏，收藏后会显示在这里。</p></div>';
    }else{
      html='<div class="empty-box"><h3>没有找到含该角色的摊位</h3><p>请清除角色筛选后重试。</p></div>';
    }
  }
  box.innerHTML=html;
}

/* ==================== 角色筛选器交互 ==================== */
const ROLE_NAMES=Object.keys(ROLE_MAP);
let roleQuery='';
function renderRoleOptions(){
  const box=document.getElementById('role-options');
  const q=roleQuery.trim().toLowerCase();
  const names=q?ROLE_NAMES.filter(n=>n.toLowerCase().indexOf(q)!==-1):ROLE_NAMES;
  let html='<button type="button" class="role-opt'+(activeRole===null?' selected':'')+'" data-role=""><span class="ro-name">全部摊位</span><span class="ro-n">清除筛选</span></button>';
  if(!names.length){box.innerHTML=html+'<div class="role-empty">没有匹配的角色</div>';return;}
  names.forEach(n=>{
    html+='<button type="button" class="role-opt'+(activeRole===n?' selected':'')+'" data-role="'+esc(n)+'"><span class="ro-name">'+esc(n)+'</span><span class="ro-n">'+ROLE_MAP[n].length+' 摊</span></button>';
  });
  box.innerHTML=html;
}
function openRolePanel(){
  document.getElementById('role-picker').classList.add('open');
  document.getElementById('role-trigger').setAttribute('aria-expanded','true');
  const s=document.getElementById('role-search');
  s.value=roleQuery;
  renderRoleOptions();
  setTimeout(()=>s.focus(),0);
}
function closeRolePanel(){
  document.getElementById('role-picker').classList.remove('open');
  document.getElementById('role-trigger').setAttribute('aria-expanded','false');
}
function selectRole(role){
  activeRole=role||null;
  document.getElementById('rt-label').textContent=activeRole?('角色：'+activeRole):'按角色筛选摊位';
  roleQuery='';
  document.getElementById('role-search').value='';
  closeRolePanel();
  renderHome();
}
function initRolePicker(){
  const trigger=document.getElementById('role-trigger');
  const search=document.getElementById('role-search');
  const options=document.getElementById('role-options');
  trigger.addEventListener('click',e=>{
    e.stopPropagation();
    if(document.getElementById('role-picker').classList.contains('open'))closeRolePanel();
    else openRolePanel();
  });
  search.addEventListener('input',()=>{roleQuery=search.value;renderRoleOptions();});
  search.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRolePanel();trigger.focus();}});
  options.addEventListener('click',e=>{
    const b=e.target.closest('.role-opt');
    if(!b)return;
    selectRole(b.dataset.role);
  });
  document.addEventListener('click',e=>{
    if(document.getElementById('role-picker').classList.contains('open')&&!e.target.closest('#role-picker'))closeRolePanel();
  });
}
initRolePicker();

/* ==================== 详情页渲染 ==================== */
function renderDetail(id){
  const idx=STALLS.findIndex(s=>s.id===id);
  const s=STALLS[idx];
  const el=document.getElementById('view-detail');
  if(!s){el.innerHTML='<div class="empty-box"><h3>没有这个摊位</h3><p>请返回主页查看完整名单。</p><a class="back-btn" href="#/">返回主页</a></div>';document.body.classList.add('detail-on');return;}
  const d=detailOf(id);
  const prev=STALLS[idx-1],next=STALLS[idx+1];
  let html='<div class="crumb view-enter">'+
      '<a class="back-btn" href="#/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>返回摊位列表</a>'+
      '<span class="sep">/</span><span class="cur">'+esc(s.id)+' · '+esc(s.name)+'</span></div>';

  html+='<section class="detail-hero view-enter"><div class="dh-row">'+
      '<span class="dh-no">'+s.id+'</span>'+
      '<span class="dh-name">'+esc(s.name)+'</span>'+
      '<span class="dh-zone">'+ZONE_NAME[id[0]]+' · 4号馆同人区</span>'+
      (d&&d.example?'<span class="demo-flag">示例数据</span>':'')+
      '<button class="fav-toggle stall-fav-btn'+(isStallFav(id)?' on':'')+'" type="button" data-fav-stall="'+id+'" aria-label="收藏摊位">'+STAR_ICO+'</button></div>';

  if(d){
    const xhsList=(Array.isArray(d.xhs)?d.xhs:(d.xhs?[d.xhs]:[])).filter(Boolean);
    const xhsHtml=xhsList.length
      ? xhsList.map((u,i)=>'<a class="xhs-link" target="_blank" rel="noopener" href="'+esc(u)+'">'+(xhsList.length>1?'小红书链接 '+(i+1):'打开摊主主页 / 帖子')+'</a>').join('')
      : '<span style="opacity:.55">暂未填写</span>';
    html+='<div class="owner-grid">'+
      '<div class="owner-cell"><div class="k">摊主 / 社团</div><div class="v">'+esc(d.owner||'—')+'</div></div>'+
      '<div class="owner-cell"><div class="k">小红书链接</div><div class="v">'+xhsHtml+'</div></div>'+
      '<div class="owner-cell"><div class="k">备注</div><div class="v">'+esc(d.note||'—')+'</div></div></div>';
    const imgs=(Array.isArray(d.images)?d.images:[]).filter(Boolean);
    if(imgs.length){
      html+='</section><div class="product-section"><div class="section-title"><span class="bar"></span><h2>制品图片</h2><span class="cnt">共 '+imgs.length+' 张</span></div><div class="gallery-grid">';
      imgs.forEach(u=>{
        html+='<figure class="gallery-card"><img class="zoomable" loading="lazy" src="'+esc(u.replace(/\/([^/.]+)\.[^.]+$/,'/thumb/$1.jpg'))+'" data-full="'+esc(u)+'" alt="制品图">'+
          '<button class="fav-toggle img-heart'+(isImgFav(u)?' on':'')+'" type="button" data-fav-img="'+esc(u)+'" aria-label="收藏图片">'+HEART_ICO+'</button></figure>';
      });
      html+='</div></div>';
    }else{
      html+='<div class="empty-box"><h3>暂无制品图片</h3><p>摊主发布制品汇总图后，把图片路径加入该摊位的 images 数组即可。</p></div></section>';
    }
  }else{
    html+='<div class="empty-box"><h3>该摊位信息尚未收录</h3>'+
      '<p>摊主可能已在小红书发布制品预告。点击下方按钮可直接用摊位名搜索，收集到信息后填入 STALL_DETAILS 即可。</p>'+
      '<a class="search-link" target="_blank" rel="noopener" href="'+xhsSearchUrl(s.name)+'">在小红书搜索“'+esc(s.name)+'”</a></div></section>';
  }

  html+='<nav class="pager view-enter">'+
    '<a class="'+(prev?'':'disabled')+'" href="#/stall/'+(prev?prev.id:'')+'"><span class="dir">上一个</span>'+(prev?prev.id+' '+esc(prev.name):'已是第一个')+'</a>'+
    '<a class="next '+(next?'':'disabled')+'" href="#/stall/'+(next?next.id:'')+'"><span class="dir">下一个</span>'+(next?next.id+' '+esc(next.name):'已是最后一个')+'</a></nav>';

  el.innerHTML=html;
  document.body.classList.add('detail-on');
}

/* ==================== 路由 ==================== */
function route(){
  const hash=location.hash||'';
  if(hash.indexOf('#/stall/')===0){
    const id=decodeURIComponent(hash.slice(8)).toUpperCase();
    renderDetail(id);
  }else{
    document.body.classList.remove('detail-on');
    renderStats();renderHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
/* ===== 图片放大 Lightbox 交互 ===== */
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lb-img');
function openLightbox(src){
  lbImg.src=src;
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  lbImg.src='';
}
document.addEventListener('click',e=>{
  const z=e.target.closest('.zoomable');
  if(z){e.preventDefault();openLightbox(z.getAttribute('data-full'));return;}
  if(lightbox.classList.contains('open')&&(e.target===lightbox||e.target.closest('#lb-close')))closeLightbox();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox();
});

/* ==================== 收藏交互（事件委托） ==================== */
document.getElementById('fav-only-btn').addEventListener('click',()=>{
  favOnly=!favOnly;
  document.getElementById('fav-only-btn').classList.toggle('active',favOnly);
  renderHome();
});
document.addEventListener('click',e=>{
  const sb=e.target.closest('[data-fav-stall]');
  if(sb){
    e.preventDefault();
    const sid=sb.dataset.favStall;
    toggleStallFav(sid);
    if(document.body.classList.contains('detail-on'))renderDetail(sid);
    else renderHome();
    return;
  }
  const hb=e.target.closest('[data-fav-img]');
  if(hb){
    e.preventDefault();
    const u=hb.dataset.favImg;
    toggleImgFav(u);
    hb.classList.toggle('on',isImgFav(u));
  }
});
route();
</script>
</body>
</html>
