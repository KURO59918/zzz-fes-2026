<html lang="zh-CN">
<head>

<style>
/* ==================== 设计变量 ==================== */
:root{
  --yellow:#f8dd33;
  --yellow-deep:#e6c91f;
  --ink:#1c1c1a;
  --ink-soft:#3a3a36;
  --paper:#e7e7e4;
  --paper-deep:#d8d8d4;
  --card:#c9c9c5;
  --card-deep:#b8b8b4;
  --light:#f5f5f2;
  --line:#262623;
  --radius:14px;
  --shadow:4px 4px 0 rgba(28,28,26,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.55;
  background-image:
    linear-gradient(rgba(28,28,26,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(28,28,26,.035) 1px,transparent 1px);
  background-size:26px 26px;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px 70px}

/* 黄黑警示斜纹条 */
.hazard{height:10px;background:repeating-linear-gradient(45deg,var(--ink) 0 14px,var(--yellow) 14px 28px)}

/* ==================== 顶部标题 ==================== */
.topbar{
  background:var(--yellow);
  border-bottom:4px solid var(--ink);
  position:relative;
  overflow:hidden;
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:26px 22px 24px;position:relative}
.topbar-side{position:absolute;right:22px;top:24px;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.fes-tag{
  border:2px solid var(--ink);border-radius:999px;padding:3px 12px;
  font-weight:900;font-size:13px;letter-spacing:1px;background:var(--light);
}
.maker{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.maker-label{font-size:10px;font-weight:900;letter-spacing:1px;color:var(--ink-soft)}
.maker-id{font-size:13px;font-weight:900;line-height:1.2}
.maker-link{
  background:var(--ink);color:var(--yellow);border:2px solid var(--ink);
  border-radius:8px;font-size:12px;font-weight:700;padding:5px 13px;transition:transform .12s;
}
.maker-link:hover{transform:translateY(-2px)}
.topbar h1{font-size:clamp(24px,4vw,40px);font-weight:900;letter-spacing:.5px;line-height:1.2}
.topbar p{margin-top:8px;font-weight:500;font-size:14px;color:var(--ink-soft);max-width:760px}
.topbar h1 .blk{background:var(--ink);color:var(--yellow);padding:0 10px;border-radius:6px;display:inline-block;transform:rotate(-1.5deg)}

/* ==================== 统计与控制条 ==================== */
.controls{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  margin:24px 0 8px;
}
.stat-pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{
  background:var(--light);border:2px solid var(--ink);border-radius:999px;
  padding:7px 16px;font-weight:700;font-size:13px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.pill b{font-size:16px}
.pill.solid{background:var(--ink);color:var(--yellow)}
.search-box{flex:1;min-width:220px;position:relative}
.search-box input{
  width:100%;padding:12px 16px 12px 42px;border:2px solid var(--ink);border-radius:10px;
  font-size:14px;font-weight:500;background:var(--light);outline:none;
}
.search-box input:focus{box-shadow:0 0 0 3px rgba(248,221,51,.7)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px}
.zone-filters{display:flex;gap:8px;flex-wrap:wrap}
.zf{
  border:2px solid var(--ink);border-radius:9px;padding:8px 18px;font-weight:900;font-size:14px;
  background:var(--light);transition:transform .12s,background .12s;
}
.zf:hover{transform:translateY(-2px)}
.zf.active{background:var(--yellow)}
.zf .n{font-size:11px;font-weight:500;opacity:.7;margin-left:3px}

/* ==================== 主页摊位区 ==================== */
.zone-block{margin-top:30px}
.zone-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.zone-badge{
  width:46px;height:46px;border-radius:50%;background:var(--yellow);
  border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;flex:none;box-shadow:var(--shadow);
}
.zone-head h2{font-weight:900;font-size:20px}
.zone-head .zc{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--paper-deep);border:1.5px solid var(--card-deep);padding:2px 10px;border-radius:999px}
.stall-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.stall-card{
  display:flex;flex-direction:column;gap:8px;min-width:0;
  background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 8px 12px;
  position:relative;transition:transform .13s,box-shadow .13s,background .13s;
}
.stall-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);background:var(--card-deep)}
.stall-card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.stall-no{
  align-self:flex-start;background:var(--yellow);color:var(--ink);font-weight:900;
  font-size:13px;padding:2px 10px;border-radius:999px;border:1.5px solid var(--ink);
}
.stall-name{font-weight:700;font-size:13px;line-height:1.35;color:var(--ink);word-break:break-word}
.stall-status{margin-top:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;align-self:flex-start}
.ss-done{background:var(--ink);color:var(--yellow)}
.ss-demo{background:var(--yellow);color:var(--ink);border:1.5px solid var(--ink)}
.ss-todo{background:transparent;color:var(--ink-soft);border:1.5px solid var(--card-deep)}
.no-result{grid-column:1/-1;text-align:center;padding:50px 20px;font-weight:700;color:var(--ink-soft);background:var(--paper-deep);border:2px dashed var(--card-deep);border-radius:12px}

/* ==================== 详情页 ==================== */
#view-detail{display:none}
body.detail-on #view-home{display:none}
body.detail-on #view-detail{display:block}
.crumb{display:flex;align-items:center;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.back-btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--yellow);
  font-weight:700;font-size:13px;padding:9px 16px;border-radius:9px;transition:transform .12s;
}
.back-btn:hover{transform:translateX(-3px)}
.crumb .sep{opacity:.4}
.crumb .cur{font-weight:700;font-size:13px}

.detail-hero{
  background:var(--light);border:3px solid var(--ink);border-radius:var(--radius);
  padding:26px 28px;position:relative;overflow:hidden;
}
.detail-hero::before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:var(--yellow);opacity:.25;border-radius:50%}
.dh-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.dh-no{
  background:var(--yellow);border:3px solid var(--ink);border-radius:14px;font-weight:900;
  font-size:30px;padding:6px 20px;transform:rotate(-2deg);box-shadow:var(--shadow);
}
.dh-name{font-size:clamp(22px,3.4vw,32px);font-weight:900}
.dh-zone{font-weight:700;font-size:13px;background:var(--paper-deep);border:1.5px solid var(--card-deep);padding:3px 12px;border-radius:999px}
.demo-flag{background:var(--yellow);border:2px solid var(--ink);font-weight:900;font-size:12px;padding:3px 10px;border-radius:7px}

.owner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;position:relative}
.owner-cell{background:var(--paper);border:2px solid var(--card-deep);border-radius:10px;padding:14px 16px;min-width:0}
.owner-cell .k{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--ink-soft);margin-bottom:6px}
.owner-cell .v{font-size:14px;font-weight:500;word-break:break-word}
.xhs-link{display:inline-flex;align-items:center;gap:7px;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;font-weight:700;font-size:13px;padding:7px 14px;transition:transform .12s}
.xhs-link:hover{transform:translateY(-2px)}
.search-link{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--yellow);border-radius:8px;font-weight:700;font-size:13px;padding:7px 14px;margin-top:8px}

/* 空状态 */
.empty-box{
  margin-top:22px;background:var(--paper-deep);border:2px dashed var(--card-deep);border-radius:12px;
  padding:34px 26px;text-align:center;
}
.empty-box h3{font-size:18px;font-weight:900;margin-bottom:8px}
.empty-box p{font-size:13px;color:var(--ink-soft);max-width:520px;margin:0 auto 16px}

/* 制品区 */
.product-section{margin-top:30px}
.section-title{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.section-title .bar{width:8px;height:26px;background:var(--yellow);border:1.5px solid var(--ink);border-radius:3px}
.section-title h2{font-size:22px;font-weight:900}
.section-title .cnt{font-size:12px;font-weight:700;color:var(--ink-soft)}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.product-card{background:var(--light);border:2px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .13s,box-shadow .13s;min-width:0}
.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.p-img{aspect-ratio:1/1;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid var(--card-deep)}
.p-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.p-img svg{width:42px;height:42px;opacity:.35}
.p-img .ph-text{position:absolute;bottom:8px;font-size:10px;font-weight:700;color:var(--ink-soft);opacity:.7}
/* ===== 图片放大 Lightbox ===== */
.lightbox{position:fixed;inset:0;background:rgba(15,15,14,.92);display:flex;align-items:center;justify-content:center;padding:18px;z-index:999;opacity:0;visibility:hidden;transition:opacity .2s;cursor:zoom-out}
.lightbox.open{opacity:1;visibility:visible}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lb-close{position:absolute;top:14px;right:18px;width:44px;height:44px;border-radius:50%;background:var(--yellow);color:var(--ink);font-size:26px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}
.lb-close:active{transform:scale(.92)}
.p-body{padding:12px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.p-type{align-self:flex-start;font-size:10px;font-weight:900;background:var(--paper-deep);border:1.5px solid var(--card-deep);padding:2px 8px;border-radius:6px}
.p-title{font-size:14px;font-weight:700;line-height:1.4;word-break:break-word}
.p-price{font-size:18px;font-weight:900;color:var(--ink)}
.p-desc{font-size:12px;color:var(--ink-soft);margin-top:auto;word-break:break-word}

/* 上一个/下一个 */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.pager a{flex:1;border:2px solid var(--ink);border-radius:10px;padding:13px 16px;background:var(--light);font-weight:700;font-size:13px;transition:background .12s;min-width:0}
.pager a:hover{background:var(--yellow)}
.pager .next{text-align:right}
.pager .dir{display:block;font-size:10px;font-weight:900;opacity:.55;letter-spacing:1px}
.pager .disabled{opacity:.4;pointer-events:none}

/* 视图进入动画 */
.view-enter{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==================== 响应式 ==================== */
@media (max-width:1100px){
  .stall-grid{grid-template-columns:repeat(5,1fr)}
  .product-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .product-grid{grid-template-columns:repeat(2,1fr)}
  .owner-grid{grid-template-columns:1fr}
  .topbar-side{position:static;align-items:flex-start;margin-top:14px}
  .maker{align-items:flex-start}
}
@media (max-width:720px){.stall-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:460px){
  .stall-grid{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:0 14px 50px}
  .detail-hero{padding:20px 18px}
}
@media (max-width:420px){.product-grid{grid-template-columns:1fr}}
</style>

/* ==================== 工具函数 ==================== */
const ZONES = ['A','B','C','D'];
const ZONE_NAME = {A:'A 区',B:'B 区',C:'C 区',D:'D 区'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* 价格：以数字开头自动加 ¥；填“无料/赠/交换”等文字则原样显示 */
function priceHtml(p){const s=p==null?'':String(p);return /^\d/.test(s)?'¥'+esc(s):esc(s);}
function detailOf(id){return STALL_DETAILS[id]||null;}
function xhsSearchUrl(name){return 'https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(name+' 绝区零');}
let activeZone='ALL';
let keyword='';

/* ==================== 主页渲染 ==================== */
function renderStats(){
  const done=STALLS.filter(s=>detailOf(s.id)).length;
  document.getElementById('stat-total').textContent=STALLS.length;
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-todo').textContent=STALLS.length-done;
}
function renderZoneFilters(){
  const el=document.getElementById('zone-filters');
  let html='<button class="zf'+(activeZone==='ALL'?' active':'')+'" data-zone="ALL">全部</button>';
  ZONES.forEach(z=>{
    const n=STALLS.filter(s=>s.id[0]===z&&detailOf(s.id)).length;
    const t=STALLS.filter(s=>s.id[0]===z).length;
    html+='<button class="zf'+(activeZone===z?' active':'')+'" data-zone="'+z+'">'+ZONE_NAME[z]+'<span class="n">'+n+'/'+t+'</span></button>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.zf').forEach(b=>b.addEventListener('click',()=>{activeZone=b.dataset.zone;renderHome();}));
}
function matchKeyword(s){
  if(!keyword)return true;
  const k=keyword.toLowerCase();
  const d=detailOf(s.id);
  let hay=s.id+' '+s.name;
  if(d){
    hay+=' '+(d.owner||'')+' '+(d.note||'');
    (d.products||[]).forEach(p=>hay+=' '+(p.title||'')+' '+(p.type||'')+' '+(p.desc||''));
  }
  return hay.toLowerCase().includes(k);
}
function statusBadge(s){
  const d=detailOf(s.id);
  if(!d)return '<span class="stall-status ss-todo">待补充</span>';
  if(d.example)return '<span class="stall-status ss-demo">示例</span>';
  return '<span class="stall-status ss-done">已收录</span>';
}
function renderHome(){
  renderZoneFilters();
  const box=document.getElementById('zone-container');
  let html='';
  let anyVisible=false;
  ZONES.forEach(z=>{
    if(activeZone!=='ALL'&&activeZone!==z)return;
    const list=STALLS.filter(s=>s.id[0]===z&&matchKeyword(s));
    if(!list.length)return;
    anyVisible=true;
    const done=STALLS.filter(s=>s.id[0]===z&&detailOf(s.id)).length;
    html+='<section class="zone-block view-enter"><div class="zone-head">'+
      '<span class="zone-badge">'+z+'</span><h2>'+ZONE_NAME[z]+'</h2>'+
      '<span class="zc">已收录 '+done+' / 9</span></div><div class="stall-grid">';
    list.forEach(s=>{
      html+='<a class="stall-card" href="#/stall/'+s.id+'">'+
        '<span class="stall-no">'+s.id+'</span>'+
        '<span class="stall-name">'+esc(s.name)+'</span>'+statusBadge(s)+'</a>';
    });
    html+='</div></section>';
  });
  box.innerHTML=anyVisible?html:'<div class="no-result view-enter">没有找到匹配“'+esc(keyword)+'”的摊位，换个关键词试试。</div>';
}

/* ==================== 详情页渲染 ==================== */
const IMG_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>';
function renderDetail(id){
  const idx=STALLS.findIndex(s=>s.id===id);
  const s=STALLS[idx];
  const el=document.getElementById('view-detail');
  if(!s){el.innerHTML='<div class="empty-box"><h3>没有这个摊位</h3><p>请返回主页查看完整名单。</p><a class="back-btn" href="#/">返回主页</a></div>';document.body.classList.add('detail-on');return;}
  const d=detailOf(id);
  const prev=STALLS[idx-1],next=STALLS[idx+1];
  let html='<div class="crumb view-enter">'+
      '<a class="back-btn" href="#/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>返回摊位列表</a>'+
      '<span class="sep">/</span><span class="cur">'+esc(s.id)+' · '+esc(s.name)+'</span></div>';

  html+='<section class="detail-hero view-enter"><div class="dh-row">'+
      '<span class="dh-no">'+s.id+'</span>'+
      '<span class="dh-name">'+esc(s.name)+'</span>'+
      '<span class="dh-zone">'+ZONE_NAME[id[0]]+' · 4号馆同人区</span>'+
      (d&&d.example?'<span class="demo-flag">示例数据</span>':'')+'</div>';

  if(d){
    const xhsList=(Array.isArray(d.xhs)?d.xhs:(d.xhs?[d.xhs]:[])).filter(Boolean);
    const xhsHtml=xhsList.length
      ? xhsList.map((u,i)=>'<a class="xhs-link" target="_blank" rel="noopener" href="'+esc(u)+'">'+(xhsList.length>1?'小红书链接 '+(i+1):'打开摊主主页 / 帖子')+'</a>').join('')
      : '<span style="opacity:.55">暂未填写</span>';
    html+='<div class="owner-grid">'+
      '<div class="owner-cell"><div class="k">摊主 / 社团</div><div class="v">'+esc(d.owner||'—')+'</div></div>'+
      '<div class="owner-cell"><div class="k">小红书链接</div><div class="v">'+xhsHtml+'</div></div>'+
      '<div class="owner-cell"><div class="k">备注</div><div class="v">'+esc(d.note||'—')+'</div></div></div>';
    if(d.products&&d.products.length){
      html+='</section><div class="product-section"><div class="section-title"><span class="bar"></span><h2>在售制品</h2><span class="cnt">共 '+d.products.length+' 项</span></div><div class="product-grid">';
      d.products.forEach(p=>{
        html+='<article class="product-card"><div class="p-img">'+
          (p.image?'<img class="zoomable" loading="lazy" src="'+esc(p.image.replace(/\/([^/]+)$/,'/thumb/$1'))+'" data-full="'+esc(p.image)+'" alt="'+esc(p.title)+'">':IMG_ICON+'<span class="ph-text">暂无图片</span>')+
          '</div><div class="p-body"><span class="p-type">'+esc(p.type||'其他')+'</span>'+
          '<h3 class="p-title">'+esc(p.title)+'</h3>'+
          '<div class="p-price">'+priceHtml(p.price)+'</div>'+
          (p.desc?'<p class="p-desc">'+esc(p.desc).replace(/\n/g,'<br>')+'</p>':'')+'</div></article>';
      });
      html+='</div></div>';
    }else{
      html+='<div class="empty-box"><h3>暂无登记制品</h3><p>可在数据区为该摊位补充 products 列表。</p></div></section>';
    }
  }else{
    html+='<div class="empty-box"><h3>该摊位信息尚未收录</h3>'+
      '<p>摊主可能已在小红书发布制品预告。点击下方按钮可直接用摊位名搜索，收集到信息后填入 STALL_DETAILS 即可。</p>'+
      '<a class="search-link" target="_blank" rel="noopener" href="'+xhsSearchUrl(s.name)+'">在小红书搜索“'+esc(s.name)+'”</a></div></section>';
  }

  html+='<nav class="pager view-enter">'+
    '<a class="'+(prev?'':'disabled')+'" href="#/stall/'+(prev?prev.id:'')+'"><span class="dir">上一个</span>'+(prev?prev.id+' '+esc(prev.name):'已是第一个')+'</a>'+
    '<a class="next '+(next?'':'disabled')+'" href="#/stall/'+(next?next.id:'')+'"><span class="dir">下一个</span>'+(next?next.id+' '+esc(next.name):'已是最后一个')+'</a></nav>';

  el.innerHTML=html;
  document.body.classList.add('detail-on');
}

/* ==================== 路由 ==================== */
function route(){
  const hash=location.hash||'';
  if(hash.indexOf('#/stall/')===0){
    const id=decodeURIComponent(hash.slice(8)).toUpperCase();
    renderDetail(id);
  }else{
    document.body.classList.remove('detail-on');
    renderStats();renderHome();
  }
  window.scrollTo(0,0);
}
document.getElementById('search-input').addEventListener('input',e=>{keyword=e.target.value.trim();renderHome();});
window.addEventListener('hashchange',route);
/* ===== 图片放大 Lightbox 交互 ===== */
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lb-img');
function openLightbox(src){
  lbImg.src=src;
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  lbImg.src='';
}
document.addEventListener('click',e=>{
  const z=e.target.closest('.zoomable');
  if(z){e.preventDefault();openLightbox(z.getAttribute('data-full'));return;}
  if(lightbox.classList.contains('open')&&(e.target===lightbox||e.target.closest('#lb-close')))closeLightbox();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox();
});
route();
</script>
